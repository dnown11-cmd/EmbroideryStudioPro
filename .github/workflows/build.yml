name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/embroidery.keystore \
            -Pandroid.injected.signing.store.password=Embroidery2026 \
            -Pandroid.injected.signing.key.alias=embroidery \
            -Pandroid.injected.signing.key.password=Embroidery2026
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmbroideryStudioPro-release
          path: app/build/outputs/apk/release/*.apk
