name: Build APK
on:
  push:
    branches: [ main, feature/extraction-v4.2, feature/dst-safe-travel-v4.5 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Install required Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify release signature and package
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 3
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmbroideryStudioPro-release
          path: app/build/outputs/apk/release/*.apk
